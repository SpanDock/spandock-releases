# Runs in SpanDock/spandock-releases (on its main branch, as
# .github/workflows/build.yml). It builds, tests, and packages the private
# source on GitHub's free public-repository runners, and can publish the
# result as the release installed apps update from.
#
# The source is read with SOURCE_DEPLOY_KEY, a read-only deploy key on
# SpanDock/spandock. This repository is public, so its run logs are public:
# steps print versions and test results only, never source or secrets.
# Only people with write access to this repository can start a run.
name: Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Source branch, tag, or commit in SpanDock/spandock (a v* tag to release)"
        required: true
        default: main
      publish:
        description: "Publish a release (only for a v* tag)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos, arch: arm64, runner: macos-15 }
          - { os: macos, arch: amd64, runner: macos-15-intel }
          - { os: linux, arch: amd64, runner: ubuntu-24.04 }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm }
          - { os: windows, arch: amd64, runner: windows-2025 }
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          repository: SpanDock/spandock
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify toolchain
        run: |
          test "$(go env GOARCH)" = "${{ matrix.arch }}"
          go version
          gcc --version | head -1

      # THIRD_PARTY_NOTICES.txt lists the modules linked on every release
      # platform, so one runner is enough to check it. It holds only
      # license texts, so printing it is safe.
      - name: Check third-party notices
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        run: |
          go run scripts/third-party-notices.go
          if ! git diff --stat --exit-code -- THIRD_PARTY_NOTICES.txt; then
            echo "THIRD_PARTY_NOTICES.txt is stale: run 'go run scripts/third-party-notices.go' and commit it"
            exit 1
          fi

      # The Postgres settings tests need a real Postgres; a throwaway one
      # runs on the Linux runners (its test password is not a secret).
      - name: Postgres for tests (Linux)
        if: matrix.os == 'linux'
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=test -p 127.0.0.1:55432:5432 postgres:17
          for i in $(seq 1 30); do docker exec pg pg_isready -U postgres >/dev/null 2>&1 && break; sleep 1; done
          echo "SPANDOCK_PG_TEST_DSN=postgres://postgres:test@127.0.0.1:55432/postgres" >> "$GITHUB_ENV"

      - name: Test
        run: go test ./...

      # SPANDOCK_LICENSE_KEYS are the public keys that sign licenses
      # ("kid:base64"); without them a release accepts no license key.
      - name: Package (macOS)
        if: matrix.os == 'macos'
        env:
          SPANDOCK_LICENSE_KEYS: ${{ secrets.SPANDOCK_LICENSE_KEYS }}
        run: ./scripts/package-macos.sh

      - name: Package (Linux)
        if: matrix.os == 'linux'
        env:
          SPANDOCK_LICENSE_KEYS: ${{ secrets.SPANDOCK_LICENSE_KEYS }}
        run: ./scripts/package-unix.sh

      - name: Package (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          SPANDOCK_LICENSE_KEYS: ${{ secrets.SPANDOCK_LICENSE_KEYS }}
        run: ./scripts/package-windows.ps1

      - name: Smoke test the release binary
        env:
          SPANDOCK_SECRET_STORE: file
        run: |
          cd "$RUNNER_TEMP"
          case "${{ matrix.os }}" in
            macos) ditto -x -k "$GITHUB_WORKSPACE/dist/release/SpanDock-macos-${{ matrix.arch }}.zip" . && bin="./SpanDock.app/Contents/MacOS/SpanDock" ;;
            linux) tar -xzf "$GITHUB_WORKSPACE/dist/release/spandock-linux-${{ matrix.arch }}.tar.gz" && bin=./spandock ;;
            windows) pwsh -NoProfile -Command "Expand-Archive -Path '$GITHUB_WORKSPACE/dist/release/spandock-windows-${{ matrix.arch }}.zip' -DestinationPath ." && bin=./spandock.exe ;;
          esac
          "$bin" -version
          ok=true
          # First launch: onboarding only. Nothing else may listen.
          "$bin" -open=false -menubar=false -config-dir "$RUNNER_TEMP/fresh" -web-addr 127.0.0.1:18787 -otlp-addr 127.0.0.1:14318 > onboarding.log 2>&1 &
          pid=$!
          for _ in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:18787/api/status && break; sleep 1; done
          curl -fsS http://127.0.0.1:18787/api/status | grep -q '"onboarding":true' || ok=false
          if curl -fsS -o /dev/null --max-time 2 http://127.0.0.1:14318/healthz; then echo "onboarding started the OTLP receiver"; ok=false; fi
          kill "$pid" || true
          wait "$pid" 2>/dev/null || true
          # A headless first start must accept the EULA.
          "$bin" -role=server -open=false -menubar=false -config-dir "$RUNNER_TEMP/no-eula" -web-addr 127.0.0.1:18787 -otlp-addr 127.0.0.1:14318 > no-eula.log 2>&1 &
          pid=$!
          for _ in $(seq 1 15); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          if kill -0 "$pid" 2>/dev/null; then echo "started without accepting the EULA"; ok=false; kill "$pid" || true; fi
          wait "$pid" 2>/dev/null || true
          grep -q 'spandock.com/legal/eula' no-eula.log || { echo "no EULA message"; ok=false; }
          # Standalone mode is retired: -role=standalone exits at once.
          if "$bin" -role=standalone -accept-eula -open=false -menubar=false -config-dir "$RUNNER_TEMP/standalone" > standalone.log 2>&1; then echo "-role=standalone started"; ok=false; fi
          # The onboarding page's files are embedded.
          "$bin" -open=false -menubar=false -config-dir "$RUNNER_TEMP/fresh2" -web-addr 127.0.0.1:18787 -otlp-addr 127.0.0.1:14318 > onboarding2.log 2>&1 &
          pid=$!
          for _ in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:18787/api/status && break; sleep 1; done
          curl -fsS -o /dev/null http://127.0.0.1:18787/js/app.js || { echo "no dashboard files"; ok=false; }
          kill "$pid" || true
          wait "$pid" 2>/dev/null || true
          # Every server needs a spandock.com account: a new headless server
          # prints the activation link and code, and waits before it starts
          # anything. A local fake stands in for spandock.com; a release build
          # accepts it only from SPANDOCK_LICENSE_SERVER on a loopback address,
          # still checks that the link is on the fake's host, and would accept
          # only tokens signed with its built-in keys. The fake's device code is
          # a public test value; the app must never print it.
          go run "$GITHUB_WORKSPACE/scripts/fake-license-server.go" 127.0.0.1:18790 > fake-license.log 2>&1 &
          fake=$!
          for _ in $(seq 1 90); do curl -fsS -o /dev/null http://127.0.0.1:18790/healthz && break; sleep 1; done
          SPANDOCK_LICENSE_SERVER=http://127.0.0.1:18790 "$bin" -role=server -accept-eula -open=false -menubar=false -config-dir "$RUNNER_TEMP/smoke" -web-addr 127.0.0.1:18787 -otlp-addr 127.0.0.1:14318 > smoke.log 2>&1 &
          pid=$!
          for _ in $(seq 1 30); do grep -q 'BCDF-2345' smoke.log && break; sleep 1; done
          grep -q 'http://127.0.0.1:18790/activate?code=BCDF-2345' smoke.log || { echo "no activation link and code"; ok=false; }
          kill -0 "$pid" 2>/dev/null || { echo "the new server didn't wait for its activation"; ok=false; }
          if grep -q 'smoke-device-code' smoke.log; then echo "the device code was printed"; ok=false; fi
          if curl -fsS -o /dev/null --max-time 2 http://127.0.0.1:14318/healthz; then echo "the server started before it was activated"; ok=false; fi
          kill "$pid" || true
          kill "$fake" || true
          if [ "$ok" != true ]; then cat onboarding.log onboarding2.log no-eula.log smoke.log; exit 1; fi

      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: spandock-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    if: inputs.publish && startsWith(inputs.ref, 'v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          repository: SpanDock/spandock
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 0
          path: source

      - name: Download release files
        uses: actions/download-artifact@v7
        with:
          pattern: spandock-*
          path: release
          merge-multiple: true

      - name: Combine checksums and write notes
        env:
          TAG: ${{ inputs.ref }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "invalid tag $TAG"; exit 1 ;; esac
          test "$(git -C source describe --tags --exact-match HEAD)" = "$TAG"
          cat release/checksums-*.txt | sort -k2 > release/checksums.txt
          rm release/checksums-*.txt
          (cd release && sha256sum -c checksums.txt)
          previous=$(git -C source describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)
          {
            echo "## SpanDock ${TAG}"
            echo
            echo "Download the DMG for your Mac (arm64 for Apple Silicon, amd64 for Intel), or the archive for Linux or Windows."
            echo "Installed apps update themselves; checksums are in checksums.txt."
            echo
            echo "### Changes"
            git -C source log --no-merges --pretty='- %s' ${previous:+"$previous..$TAG"}
          } > notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.ref }}
        run: |
          flags=(--latest)
          case "$TAG" in *-*) flags=(--prerelease --latest=false) ;; esac
          # Re-running a release replaces it, so a fixed build can be republished.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" release/* --target main --title "SpanDock $TAG" --notes-file notes.md "${flags[@]}"

      # The Homebrew tap (SpanDock/homebrew-spandock) gets this release's cask
      # and formula. TAP_DEPLOY_KEY can write only to the tap. Prereleases
      # are skipped, so `brew upgrade` follows stable releases.
      - name: Update the Homebrew tap
        if: ${{ !contains(inputs.ref, '-') }}
        env:
          TAP_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          TAG: ${{ inputs.ref }}
        run: |
          if [ -z "$TAP_KEY" ]; then echo "TAP_DEPLOY_KEY is not set; skipping the tap"; exit 0; fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TAP_KEY" > ~/.ssh/tap
          chmod 600 ~/.ssh/tap
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone -q git@github.com:SpanDock/homebrew-spandock.git tap
          sh source/packaging/homebrew/render.sh "${TAG#v}" release/checksums.txt tap
          cd tap
          git add -A
          if git diff --cached --quiet; then echo "The tap is already at $TAG"; exit 0; fi
          git -c user.name="SpanDock release" -c user.email="releases@users.noreply.github.com" commit -q -m "SpanDock ${TAG#v}"
          git push -q origin HEAD:main
          rm -f ~/.ssh/tap
